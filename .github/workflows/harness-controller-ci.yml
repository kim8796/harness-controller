name: Harness Controller CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  starter-smoke:
    name: Starter smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint focused harness surfaces
        run: python -m ruff check scripts/harness_autonomy.py scripts/harness_autonomy/core.py scripts/harness_capability_registry.py scripts/harness_cli.py scripts/harness_controller.py scripts/harness_controller_sanitization.py scripts/harness_env.py scripts/harness_export.py scripts/harness_fleet.py scripts/harness_goal.py scripts/harness_goal_contract.py scripts/harness_goal_gates.py scripts/harness_guard.py scripts/harness_product_audit.py scripts/harness_product_audit_support.py scripts/harness_product_setup_readiness.py scripts/harness_publication.py scripts/harness_release.py scripts/harness_request_ledger.py scripts/harness_request_publication.py scripts/harness_relay_store.py scripts/harness_starter_install.py scripts/harness_telegram_bridge.py scripts/harness_watch.py scripts/harness_autonomy/relay.py tests/test_harness_autonomy.py tests/test_harness_capability_registry.py tests/test_harness_cli.py tests/test_harness_controller.py tests/test_harness_controller_sanitization.py tests/test_harness_env.py tests/test_harness_export.py tests/test_harness_fleet.py tests/test_harness_goal.py tests/test_harness_goal_contract.py tests/test_harness_goal_gates.py tests/test_harness_goal_request_traceability.py tests/test_harness_guard.py tests/test_harness_product_audit.py tests/test_harness_product_maintainability.py tests/test_harness_product_setup_readiness.py tests/test_harness_publication.py tests/test_harness_release.py tests/test_harness_request_ledger.py tests/test_harness_request_publication.py tests/test_harness_request_gate.py tests/test_harness_relay_store.py tests/test_harness_telegram_bridge.py tests/test_harness_watch.py tests/test_redis_relay.py
      - name: Run focused tests
        env:
          HARNESS_GIT_AUTHOR_NAME: Harness CI
          HARNESS_GIT_AUTHOR_EMAIL: harness-ci@users.noreply.github.com
        run: python -m pytest tests/test_harness_autonomy.py tests/test_harness_capability_registry.py tests/test_harness_cli.py tests/test_harness_controller.py tests/test_harness_controller_sanitization.py tests/test_harness_env.py tests/test_harness_export.py tests/test_harness_fleet.py tests/test_harness_goal.py tests/test_harness_goal_contract.py tests/test_harness_goal_gates.py tests/test_harness_goal_request_traceability.py tests/test_harness_guard.py tests/test_harness_product_audit.py tests/test_harness_product_maintainability.py tests/test_harness_product_setup_readiness.py tests/test_harness_publication.py tests/test_harness_release.py tests/test_harness_request_ledger.py tests/test_harness_request_publication.py tests/test_harness_request_gate.py tests/test_harness_relay_store.py tests/test_harness_telegram_bridge.py tests/test_harness_watch.py tests/test_redis_relay.py -q
      - name: Export source check
        run: python scripts/harness_export.py --check --controller-bundle "$RUNNER_TEMP/controller-source-check"
      - name: Controller sanitization and self-test
        env:
          HARNESS_GIT_AUTHOR_NAME: Harness CI
          HARNESS_GIT_AUTHOR_EMAIL: harness-ci@users.noreply.github.com
        run: |
          python harness controller export "$RUNNER_TEMP/harness-controller-controller-bundle" --sanitize-report "$RUNNER_TEMP/controller-sanitization-report.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          bundle = temp / "harness-controller-controller-bundle"
          report = json.loads((temp / "controller-sanitization-report.json").read_text())
          assert report["ok"], report
          assert not report["blockers"], report
          assert not report["controller_surface_mentions"], report
          historical_mentions = report.get("historical_mentions", [])
          allowed_historical_paths = {"tests/test_harness_autonomy.py"}
          unexpected_historical = [
              entry for entry in historical_mentions if entry.get("path") not in allowed_historical_paths
          ]
          assert not unexpected_historical, report
          if historical_mentions:
              print(
                  "controller sanitize historical warning:",
                  len(historical_mentions),
                  "entries",
                  "truncated=",
                  report.get("historical_mentions_truncated"),
              )
              print("allowed historical paths:", sorted({entry.get("path") for entry in historical_mentions}))
          subprocess.run(["git", "init", "-b", "main"], cwd=bundle, check=True)
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pytest",
                  "tests/test_harness_autonomy.py",
                  "tests/test_harness_capability_registry.py",
                  "tests/test_harness_cli.py",
                  "tests/test_harness_controller.py",
                  "tests/test_harness_controller_sanitization.py",
                  "tests/test_harness_env.py",
                  "tests/test_harness_export.py",
                  "tests/test_harness_fleet.py",
                  "tests/test_harness_goal.py",
                  "tests/test_harness_goal_contract.py",
                  "tests/test_harness_goal_gates.py",
                  "tests/test_harness_goal_request_traceability.py",
                  "tests/test_harness_guard.py",
                  "tests/test_harness_product_audit.py",
                  "tests/test_harness_product_maintainability.py",
                  "tests/test_harness_product_setup_readiness.py",
                  "tests/test_harness_publication.py",
                  "tests/test_harness_release.py",
                  "tests/test_harness_request_ledger.py",
                  "tests/test_harness_request_publication.py",
                  "tests/test_harness_request_gate.py",
                  "tests/test_harness_relay_store.py",
                  "tests/test_harness_telegram_bridge.py",
                  "tests/test_harness_watch.py",
                  "tests/test_redis_relay.py",
                  "-q",
              ],
              cwd=bundle,
              check=True,
          )
          PY
      - name: Starter sanitization report
        run: |
          python scripts/harness_export.py --starter-bundle "$RUNNER_TEMP/harness-controller-bundle" --sanitize-report "$RUNNER_TEMP/dist-sanitization-report.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "dist-sanitization-report.json").read_text())
          assert report["ok"], report
          PY
      - name: Clean clone/install/upgrade smoke
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          bundle = temp / "harness-controller-bundle"
          project = temp / "harness-smoke-project"
          env = dict(os.environ)
          for key in list(env):
              if key.startswith("GIT_"):
                  env.pop(key, None)
          subprocess.run([sys.executable, str(bundle / "harness"), "new", str(project), "--no-input"], check=True, env=env)
          subprocess.run([sys.executable, "harness", "complete-setup", "--apply"], cwd=project, check=True, env=env)
          subprocess.run([sys.executable, "harness", "verify", "--loop-ready"], cwd=project, check=True, env=env)
          subprocess.run([sys.executable, "harness", "upgrade", "--source", str(bundle), "--json"], cwd=project, check=True, env=env)
          subprocess.run([sys.executable, str(bundle / "harness"), "self", "doctor"], cwd=bundle, check=True, env=env)
          PY
